<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>ADT</title>
    <link rel="stylesheet" href="/public/css/registationADT.css">
    <link rel="shortcut icon" href="/public/image/hydrangeaIcon.png" type="image/x-icon">
</head>

<body>
    <div class="biggestContainer">

        <!-- leftside -->
        <div class="leftside">
            <div id="logo">
                <h1>ADT</h1>
            </div>
            <div id="schoolname">
                <h1>School of Applied Digital Technologies</h1>
            </div>
            <div id="subtitile">
                <p>New, Different, Better</p>
            </div>
        </div>

        <!-- rightside -->
        <div class="rightside">
            <h2>Registration</h2>
            <div class="email">
                <label>Email Address</label>
                <input type="email" placeholder="student@lamduan.mfu.ac.th">
            </div>
            <div class="password">
                <div class="field">
                    <label>Password</label>
                    <input type="password">
                </div>
                <div class="field">
                    <label>Confirm</label>
                    <input type="password">
                </div>
            </div>

            <label id="gendertext">Gender</label>
            <div class="gender">
                <label><input type="radio" name="gender"> Male</label>
                <label><input type="radio" name="gender"> Female</label>
                <label><input type="radio" name="gender"> Other</label>
            </div>

            <label id="majortext">Intended Major</label>
            <div class="majorselect">
                <select>
                    <option>Select a Program</option>
                    <option value="cs">Computer Science</option>
                    <option value="it">Information Technology</option>
                    <option value="ds">Data Science</option>
                </select>
            </div>
            <div class="checkbox">
                <label>
                    <input type="checkbox">
                    I agree to the school terms of enrollment and privacy policy.
                </label>
            </div>
            <div class="registerbutton">
                <button>Register Account</button>
            </div>

        </div>


    </div>
</body>

</html>
