<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Login</title>
</head>

<body class="flex h-screen justify-center items-center">
    <form>
        <fieldset class="fieldset w-xs p-4 bg-base-300 shadow-xl rounded-lg text-center">
            <h3 class="text-lg font-bold">Login to Shop</h3>
            <input name="txtUsername" type="text" class="input input-primary" placeholder="username" required>
            <input name="txtPassword" type="password" class="input input-primary" placeholder="password" required>
            <button id="btnLogin" type="submit" class="btn btn-primary">Login</button>
        </fieldset>
    </form>

    <script src="/webappWeek6/login.js"></script>
</body>

</html>
