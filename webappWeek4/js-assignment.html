<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Assignment</title>
    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-base-200">

    <fieldset class="border border-base-300 rounded-lg p-6 w-96 bg-base-100 w-full md:w-165">
        <legend class="px-2 text-lg font-bold">
            Register
        </legend>

        <input id="username" type="text" placeholder="Username" class="input input-bordered w-full mb-3" />
        <input id="password" type="password" placeholder="Password" class="input input-bordered w-full mb-3" />
        <input id="confirm" type="password" placeholder="Confirm Password" class="input input-bordered w-full mb-3" />

        <h4 class="text-purple-600">Captcha = <span id="captcha"></span></h4>
        <input id="captchaInput" type="text" placeholder="Enter Captcha" class="input input-bordered w-full mb-3" />

        <button class="btn btn-primary w-full mt-5" id="registerbtn">Register</button>

        <h1 id="resultMessage" class="resultMessage"></h1>
    </fieldset>

    <script src="/public/js/js-assignment.js"></script>
</body>

</html>
