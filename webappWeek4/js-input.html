<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input</title>
</head>

<body>
    <h1>your likes</h1>
    <input type="text" id="favNumber" placeholder="your fav number"><br><br>


    your fav color
    <select id="color">
        <option value="red">red</option>
        <option value="green">green</option>
        <option value="blue">blue</option>
    </select><br><br>

    your fav sport
    <input type="radio" name="sport" value="football" checked>football
    <input type="radio" name="sport" value="basketball">basketball
    <input type="radio" name="sport" value="volleyball">volleyball
    <br><br>

    your fav food
    <input type="checkbox" name="food" value="pizza">pizza
    <input type="checkbox" name="food" value="sushi">sushi
    <input type="checkbox" name="food" value="ice-cream">ice-cream
    <br><br>
    <button>submit</button>

    <p id="output"></p>

    <script src="/public/js/input.js"></script>
</body>

</html>
