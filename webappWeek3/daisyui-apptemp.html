<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>DaisyUI Landing</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-100 text-base-content">

    <!-- Navbar -->
    <header class="px-5 pt-5 flex justify-between items-center max-w-[390px] mx-auto">
        <span class="font-bold text-lg text-primary">AppLogo</span>
        <button class="btn btn-primary btn-sm rounded-full px-4">Get Started</button>
    </header>

    <!-- Hero -->
    <section class="px-5 mt-16 max-w-[390px] mx-auto">
        <h1 class="text-[2.4rem] font-bold leading-tight tracking-tight">
            The simplest way<br>
            to manage your <span class="text-primary">tasks</span>
        </h1>

        <p class="mt-5 text-base opacity-70 leading-relaxed">
            One clean workspace to focus, plan, and finish work faster.
        </p>

        <div class="mt-8 space-y-3">
            <button class="btn btn-primary w-full h-12 text-base rounded-xl">
                Start Free Trial
            </button>
            <button class="btn btn-ghost w-full h-12 text-base rounded-xl border border-base-300">
                Watch Demo
            </button>
        </div>
    </section>

    <!-- Mockup -->
    <section class="px-5 mt-14 max-w-[390px] mx-auto">
        <div class="rounded-2xl bg-base-200 h-44 flex items-center justify-center text-sm opacity-50">
            App Preview
        </div>
    </section>

    <!-- Features -->
    <section class="px-5 mt-20 max-w-[390px] mx-auto space-y-6">
        <h2 class="text-xl font-semibold">
            Everything you need.
        </h2>

        <div class="space-y-4">
            <div class="p-5 rounded-xl bg-base-100 shadow-sm border border-base-200">
                <h3 class="font-medium">Automated Workflow</h3>
                <p class="text-sm opacity-70 mt-1">
                    Let tasks run themselves.
                </p>
            </div>

            <div class="p-5 rounded-xl bg-base-100 shadow-sm border border-base-200">
                <h3 class="font-medium">Team Collaboration</h3>
                <p class="text-sm opacity-70 mt-1">
                    Real-time updates.
                </p>
            </div>

            <div class="p-5 rounded-xl bg-base-100 shadow-sm border border-base-200">
                <h3 class="font-medium">Integrations</h3>
                <p class="text-sm opacity-70 mt-1">
                    Slack, Gmail, Drive.
                </p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="mt-24 py-8 text-center text-xs opacity-50">
        © 2025 AppName
    </footer>

</body>

</html>
